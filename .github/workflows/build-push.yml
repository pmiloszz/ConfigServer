name: Build and Push

on:
  push:
    branches: [ main ]

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push backend
        env:
          SHORT_SHA: ${{ github.sha }}
        run: |
          SHORT_SHA="${SHORT_SHA:0:6}"
          BACKEND_IMAGE="ghcr.io/${{ github.repository_owner }}/feature-flags-api:sha-${SHORT_SHA}"
          echo "Pushing backend image: ${BACKEND_IMAGE}"
          docker build -t "${BACKEND_IMAGE}" .
          docker push "${BACKEND_IMAGE}"

      - name: Build and push frontend
        env:
          SHORT_SHA: ${{ github.sha }}
        run: |
          SHORT_SHA="${SHORT_SHA:0:6}"
          FRONTEND_IMAGE="ghcr.io/${{ github.repository_owner }}/feature-flags-frontend:sha-${SHORT_SHA}"
          echo "Pushing frontend image: ${FRONTEND_IMAGE}"
          docker build -t "${FRONTEND_IMAGE}" -f frontend/Dockerfile .
          docker push "${FRONTEND_IMAGE}"

