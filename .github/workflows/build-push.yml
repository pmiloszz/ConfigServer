name: Build and Push

on:
  push:
    branches: [ main ]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: write
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push backend
        env:
          SHORT_SHA: ${{ github.sha }}
        run: |
          SHORT_SHA="${SHORT_SHA:0:6}"
          BACKEND_IMAGE="ghcr.io/${{ github.repository_owner }}/feature-flags-api:sha-${SHORT_SHA}"
          echo "Pushing backend image: ${BACKEND_IMAGE}"
          docker build -t "${BACKEND_IMAGE}" .
          docker push "${BACKEND_IMAGE}"

      - name: Build and push frontend
        env:
          SHORT_SHA: ${{ github.sha }}
        run: |
          SHORT_SHA="${SHORT_SHA:0:6}"
          FRONTEND_IMAGE="ghcr.io/${{ github.repository_owner }}/feature-flags-frontend:sha-${SHORT_SHA}"
          echo "Pushing frontend image: ${FRONTEND_IMAGE}"
          docker build -t "${FRONTEND_IMAGE}" -f frontend/Dockerfile .
          docker push "${FRONTEND_IMAGE}"

      - name: Update dev overlay image tags
        env:
          SHORT_SHA: ${{ github.sha }}
        run: |
          SHORT_SHA="${SHORT_SHA:0:6}"
          sed -i "s/newTag: sha-.*/newTag: sha-${SHORT_SHA}/" \
            k8s/feature-flags/overlays/dev/kustomization.yaml

      - name: Commit updated dev image tags
        env:
          SHORT_SHA: ${{ github.sha }}
        run: |
          SHORT_SHA="${SHORT_SHA:0:6}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add k8s/feature-flags/overlays/dev/kustomization.yaml
          git diff --cached --quiet || git commit -m "ci: update dev image tags to sha-${SHORT_SHA}"
          git push

