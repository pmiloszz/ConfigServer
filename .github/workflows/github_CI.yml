name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: [3.14]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python-version }}

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/pyproject.toml','**/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Show Python and pip info (debug)
        run: |
          python -V
          pip -V
          python -m pip install --upgrade pip
          pip freeze | sed -n '1,200p'

      - name: Install build tools
        run: |
          python -m pip install --upgrade pip setuptools wheel

      - name: Install project (editable) and test deps
        run: |
          # install package in editable mode so tests import project as installed package
          pip install -e .
          # install test extras if any (falls back to minimal test deps)
          pip install -e ".[test]" || pip install pytest httpx

      - name: Add repo root to PYTHONPATH (safety)
        run: echo "PYTHONPATH=${{ github.workspace }}" >> $GITHUB_ENV

      - name: Set DATABASE_URL for CI
        run: echo "DATABASE_URL=sqlite:///./test_flags.db" >> $GITHUB_ENV

      - name: Enable Alembic usage in app
        run: echo "USE_ALEMBIC=true" >> $GITHUB_ENV

      - name: Install Alembic
        run: |
          python -m pip install --upgrade pip
          pip install alembic

      - name: Run Alembic migrations via uv
        run: |
          if command -v uv >/dev/null 2>&1; then
            uv run alembic upgrade head
          else
            alembic upgrade head
          fi

      - name: Run tests (pytest)
        run: |
          pytest -q --junitxml=report.xml

      - name: Upload junit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-report-${{ matrix.python-version }}
          path: report.xml