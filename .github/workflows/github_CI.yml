name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

env:
  # tymczasowe opt-in do Node 24 (usuwa deprecation warnings)
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: [3.11, 3.12]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python-version }}

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/pyproject.toml','**/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Show Python and pip info (debug)
        run: |
          python -V
          pip -V
          python -m pip install --upgrade pip
          pip freeze | sed -n '1,200p'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # prefer requirements.txt if present, otherwise install minimal deps
          if [ -f "requirements.txt" ]; then
            pip install -r requirements.txt
          else
            pip install pytest httpx fastapi sqlmodel sqlalchemy uvicorn
          fi

      - name: Run tests (pytest)
        run: |
          pytest -q --junitxml=report.xml
        continue-on-error: false

      - name: Upload junit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-report-${{ matrix.python-version }}
          path: report.xml