name: Kind Manifest Validate

on:
  pull_request:
    branches: [ main, master ]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up kubectl
        uses: azure/setup-kubectl@v4
        with:
          version: "latest"

      - name: Set up kind
        uses: engineerd/setup-kind@v0.5.0
        with:
          version: v0.26.0
          name: kind-feature-flags

      - name: Build backend image (dev tag)
        run: |
          BACKEND_IMAGE="ghcr.io/pmiloszz/feature-flags-api:dev"
          docker build -t "$BACKEND_IMAGE" .

      - name: Build frontend image (dev tag)
        run: |
          FRONTEND_IMAGE="ghcr.io/pmiloszz/feature-flags-frontend:dev"
          docker build -t "$FRONTEND_IMAGE" -f frontend/Dockerfile .

      - name: Load images into kind
        run: |
          kind load docker-image --name kind-feature-flags "ghcr.io/pmiloszz/feature-flags-api:dev"
          kind load docker-image --name kind-feature-flags "ghcr.io/pmiloszz/feature-flags-frontend:dev"

      - name: Apply manifests (workloads only)
        run: |
          kubectl apply -k k8s/feature-flags/overlays/dev

      - name: Basic kubectl checks
        run: |
          kubectl get ns feature-flags
          kubectl get deploy -n feature-flags
          kubectl get statefulset -n feature-flags
          kubectl get svc -n feature-flags

