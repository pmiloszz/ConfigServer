# k8s/00-namespace.yaml
#
# A Namespace is a logical partition inside a Kubernetes cluster.
# Everything for this app lives in the "configserver" namespace,
# isolated from other workloads running on the same cluster.
#
# Apply:  kubectl apply -f k8s/00-namespace.yaml
# Delete: kubectl delete namespace configserver  (removes EVERYTHING in it)

apiVersion: v1
kind: Namespace
metadata:
  name: configserver
  labels:
    app.kubernetes.io/name: configserver