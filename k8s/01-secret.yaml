# k8s/01-secret.yaml
#
# Secrets hold sensitive values. Kubernetes stores them base64-encoded
# (NOT encrypted by default — use Sealed Secrets or external secret
# managers like AWS Secrets Manager / Vault in real production).
#
# NEVER commit real credentials to git. This file contains placeholder
# values. Before applying, replace them with real base64 values:
#
#   echo -n "your-actual-password" | base64
#
# The placeholder values below decode to:
#   POSTGRES_PASSWORD → "changeme"
#   API_KEY           → "changeme"
#
# Generate a proper API key:
#   python -c "import secrets; print(secrets.token_hex(32))"
# Then base64 encode it:
#   echo -n "the-generated-key" | base64

apiVersion: v1
kind: Secret
metadata:
  name: configserver-secret
  namespace: configserver
type: Opaque
data:
  # Replace these before deploying to a real cluster
  POSTGRES_PASSWORD: Y2hhbmdlbWU=   # "changeme" — replace this
  API_KEY: Y2hhbmdlbWU=             # "changeme" — replace this