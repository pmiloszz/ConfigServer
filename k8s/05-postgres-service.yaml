# k8s/05-postgres-service.yaml
#
# A Service gives a stable DNS name and IP to a group of pods.
# Pods themselves are ephemeral — they get new IPs on restart.
# The Service address never changes, so the app always has a
# reliable target to connect to.
#
# ClusterIP (the default) means this Service is only reachable
# from inside the cluster — correct for a database that should
# never be exposed to the internet.
#
# Inside the cluster, the app connects to postgres using:
#   postgres-service.configserver.svc.cluster.local:5432
# or just the short form within the same namespace:
#   postgres-service:5432

apiVersion: v1
kind: Service
metadata:
  name: postgres-service
  namespace: configserver
  labels:
    app: postgres
spec:
  type: ClusterIP
  selector:
    app: postgres    # routes to pods with this label — matches the StatefulSet
  ports:
    - port: 5432
      targetPort: 5432
      protocol: TCP