# k8s/07-app-service.yaml
#
# Two service types are relevant here:
#
#   ClusterIP   → internal only (what postgres uses)
#   NodePort    → exposes a port on every cluster node's IP.
#                 Good for local testing with minikube.
#                 Access via: minikube service configserver-service -n configserver
#   LoadBalancer → cloud providers provision an external load balancer with
#                  a public IP. Use this for production on EKS/GKE/AKS.
#
# This file uses LoadBalancer. On minikube, run `minikube tunnel` in a
# separate terminal to make the external IP resolve on your machine.
# On a cloud cluster it provisions a real load balancer automatically.
#
# When you're ready for a proper domain with TLS, replace this with an
# Ingress resource pointing at an ingress controller (nginx-ingress or
# Traefik). That's outside scope for now.

apiVersion: v1
kind: Service
metadata:
  name: configserver-service
  namespace: configserver
  labels:
    app: configserver
spec:
  type: LoadBalancer
  selector:
    app: configserver    # routes to app pods
  ports:
    - name: http
      port: 80           # external port (what clients connect to)
      targetPort: 8000   # internal port (what the app listens on)
      protocol: TCP