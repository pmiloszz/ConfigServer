apiVersion: apps/v1
kind: Deployment
metadata:
  name: feature-flags-api
  namespace: feature-flags
  labels:
    app: feature-flags-api
  annotations:
      reloader.stakater.com/auto: 'true'
spec:
  replicas: 1
  selector:
    matchLabels:
      app: feature-flags-api
  template:
    metadata:
      labels:
        app: feature-flags-api
    spec:
      containers:
        - name: api
          image: ghcr.io/pmiloszz/feature-flags-api:latest
          ports:
            - containerPort: 8000
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: feature-flags-secret
                  key: DATABASE_URL
            - name: API_KEY
              valueFrom:
                secretKeyRef:
                  name: feature-flags-secret
                  key: ADMIN_TOKEN
            - name: ENVIRONMENT
              valueFrom:
                configMapKeyRef:
                  name: feature-flags-config
                  key: ENVIRONMENT
            - name: DEBUG
              valueFrom:
                configMapKeyRef:
                  name: feature-flags-config
                  key: DEBUG
            - name: USE_ALEMBIC
              valueFrom:
                configMapKeyRef:
                  name: feature-flags-config
                  key: USE_ALEMBIC
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 15
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 5
            failureThreshold: 3

