apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../base
  - ingress.yaml
  - tls-secret.yaml

patches:
  - path: patch-configmap-dev.yaml
    target:
      kind: ConfigMap
      name: feature-flags-config

images:
  - name: ghcr.io/pmiloszz/feature-flags-api
    newTag: dev
  - name: ghcr.io/pmiloszz/feature-flags-frontend
    newTag: dev

