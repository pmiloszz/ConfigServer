[project]
name = "configserver"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "fastapi[standard]>=0.134.0",
    "uvicorn>=0.42.0",
    "sqlmodel>=0.0.37",
    "sqlalchemy==2.0.48",
    "pydantic==2.12.5",
    "pydantic-settings>=2.0.0",
    "alembic>=1.18.4",
    "psycopg[binary]>=3.1",
]

[dependency-groups]
dev = [
  "ruff>=0.15.7",
  "pre-commit>=4.5.1",
  "pytest==9.0.2",
  "httpx==0.28.1",
  "pytest-cov==4.1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 120
exclude = ["alembic/versions"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.pytest.ini_options]
minversion = "9.0"
addopts = "-q --cov=app --cov-report=term-missing"
testpaths = ["tests"]
